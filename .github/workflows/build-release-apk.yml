name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Compile release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source with recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16138531" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install Native Build Tools and CMake 4.4.3
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison ninja-build python3-pip python3-setuptools pkg-config
          pip install --break-system-packages meson cmake==4.4.3 || pip install meson cmake==4.4.3
          CMAKE_DATA_DIR="$(python3 -c 'import cmake; print(cmake.CMAKE_DATA)')"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          mkdir -p "$SDK_DIR/cmake"
          ln -sfn "$CMAKE_DATA_DIR" "$SDK_DIR/cmake/4.4.3"
          echo "CMake 4.4.3 configured at $SDK_DIR/cmake/4.4.3"
          "$SDK_DIR/cmake/4.4.3/bin/cmake" --version

      - name: Build Native Wayland & Weston Stack
        run: |
          chmod +x ./native/weston/build_wayland_stack.sh
          ./native/weston/build_wayland_stack.sh

      - name: Verify Real libweston & Pixman ARM64 Linkage & Provenance
        run: |
          echo "=== Weston Build Provenance ==="
          cat ./native/weston/weston_provenance.json
          echo "=== Pixman Build Provenance ==="
          cat ./native/weston/pixman_provenance.json
          echo "=== Architecture Verification ==="
          file ./app/src/main/jniLibs/arm64-v8a/libweston-*.so | grep -E "ELF 64-bit.*aarch64"
          echo "=== Symbol Verification ==="
          nm -D ./app/src/main/jniLibs/arm64-v8a/libweston-*.so | grep -E "weston_compositor_create|weston_compositor_add_head|weston_compositor_backends_loaded|pixman_renderer_init|weston_compositor_init_renderer"

      - name: Verify Core Components & PRoot Provenance
        run: |
          echo "=== Git Submodule Status ==="
          git submodule status
          echo "=== Components Provenance ==="
          cat ./app/src/main/assets/components_provenance.json
          echo "=== PRoot Manifest ==="
          cat ./app/src/main/assets/proot/arm64-v8a/MANIFEST.txt
          echo "=== PRoot Binary Architecture ==="
          file ./app/src/main/assets/proot/arm64-v8a/proot | grep -E "ELF 64-bit.*aarch64"
          file ./app/src/main/assets/proot/arm64-v8a/loader | grep -E "ELF 64-bit.*aarch64"
          echo "=== Verify PRoot Binary DT_NEEDED Dependencies ==="
          readelf -d ./app/src/main/assets/proot/arm64-v8a/proot | grep -E "NEEDED"
          if readelf -d ./app/src/main/assets/proot/arm64-v8a/proot | grep -E "(libtalloc|libandroid-shmem)"; then
            echo "ERROR: proot binary has unexpected DT_NEEDED dependency on libtalloc or libandroid-shmem!"
            exit 1
          fi
          echo "=== Verify No Obsolete Binaries ==="
          test ! -f ./app/src/main/assets/proot/arm64-v8a/guest-mem
          test ! -f ./app/src/main/assets/proot/arm64-v8a/linuxdroid-selftest

      - name: Run Complete Unit Test Suite
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      # The current Gradle release configuration requires a keystore.
      # This key is temporary and must not be used for production releases.
      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass linuxdroid \
            -keypass linuxdroid \
            -alias linuxdroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=LinuxDroid CI,O=LinuxDroid"

      - name: Compile release APK
        shell: bash
        run: |
          # Preserve the full Gradle output to a file for failure diagnostics,
          # while still failing the step if the build fails (pipefail).
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Verify Packaged Release APK Artifacts
        run: |
          echo "=== Verifying Packaged PRoot and Weston in APK ==="
          APK_FILE="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          unzip -l "$APK_FILE" | grep -E "assets/proot/arm64-v8a/proot"
          unzip -l "$APK_FILE" | grep -E "assets/proot/arm64-v8a/loader"
          unzip -l "$APK_FILE" | grep -E "assets/proot/arm64-v8a/MANIFEST.txt"
          unzip -l "$APK_FILE" | grep -E "assets/components_provenance.json"
          unzip -l "$APK_FILE" | grep -E "lib/arm64-v8a/libproot.so"
          unzip -l "$APK_FILE" | grep -E "lib/arm64-v8a/libproot_loader.so"
          unzip -l "$APK_FILE" | grep -E "lib/arm64-v8a/libweston"
          echo "=== Verifying No Obsolete or Loose Linux Libraries in APK ==="
          if unzip -l "$APK_FILE" | grep -E "(libtalloc\.so|libandroid-shmem\.so|guest-mem|linuxdroid-selftest)"; then
            echo "ERROR: Unwanted or obsolete binaries / libraries packaged in release APK!"
            exit 1
          fi
          echo "=== Verifying libproot.so Has Zero DT_NEEDED for libtalloc.so ==="
          mkdir -p /tmp/apk_check && unzip -p "$APK_FILE" "lib/arm64-v8a/libproot.so" > /tmp/apk_check/libproot.so
          readelf -d /tmp/apk_check/libproot.so | grep -E "NEEDED"
          if readelf -d /tmp/apk_check/libproot.so | grep -E "(libtalloc|libandroid-shmem)"; then
            echo "ERROR: libproot.so still dynamically links libtalloc.so or libandroid-shmem.so!"
            exit 1
          fi
          echo "=== Verifying Graphical Packages & Rootfs Installer in APK ==="
          unzip -l "$APK_FILE" | grep -E "assets/packages/linuxdroid-display-manager_.*_arm64\.deb"
          unzip -l "$APK_FILE" | grep -E "assets/packages/linuxdroid-desktop-environment_.*_arm64\.deb"
          unzip -l "$APK_FILE" | grep -E "assets/packages/PACKAGES_MANIFEST\.txt"
          unzip -l "$APK_FILE" | grep -E "assets/scripts/install_rootfs\.sh"
          echo "APK packaging verification passed."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log.txt
          if-no-files-found: warn
          retention-days: 7
          path: build-log.txt

      - name: Generate APK checksum
        run: |
          sha256sum app/build/outputs/apk/release/*.apk \
            > app/build/outputs/apk/release/SHA256SUMS

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: linuxdroid-release-apk
          if-no-files-found: error
          retention-days: 1
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
